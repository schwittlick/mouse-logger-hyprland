[project]
name = "mouse-logger"
version = "0.1.0"
description = "Passive mouse/cursor movement recorder for Hyprland (Wayland)"
authors = [
    { name = "Marcel Schwittlick", email = "info@schwittlick.net" }
]
requires-python = ">=3.14"
dependencies = [
    "evdev>=2.0.0",
    "msgpack>=1.1",
]

[project.scripts]
mouse-logger = "mouse_logger.cli:main"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.9",
]
similar = [
    "numpy>=2.0",
    "pyside6>=6.9",
]
fountain = [
    "fastapi>=0.120",
    "msgpack>=1.1",
    "numpy>=2.0",
    "orjson>=3.10",
    "pyarrow>=21",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
